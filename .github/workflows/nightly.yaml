name: Nightly (slow and downloading tests)

# The per-PR suite is hermetic and fast. The tests that download datasets or
# take minutes to fit run here instead, so a slow or flaky external dependency
# never blocks a pull request.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  slow:
    name: Slow tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # xvfb is kept as insurance, not for any test that asks for a
          # display: nothing in the suite does now. A library that opens a
          # window where none was expected would otherwise abort the process
          # in native code, which loses the whole run rather than one test.
          sudo apt-get install -y libsndfile1 libglib2.0-dev xvfb
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run slow tests
        run: xvfb-run -a pytest --slow -m slow

  download:
    name: Dataset download tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # xvfb is kept as insurance, not for any test that asks for a
          # display: nothing in the suite does now. A library that opens a
          # window where none was expected would otherwise abort the process
          # in native code, which loses the whole run rather than one test.
          sudo apt-get install -y libsndfile1 libglib2.0-dev xvfb
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run downloading tests
        run: xvfb-run -a pytest --download -m download
