name: Nightly (slow and downloading tests)

# The per-PR suite is hermetic and fast. The tests that download datasets or
# take minutes to fit run here instead, so a slow or flaky external dependency
# never blocks a pull request.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  slow:
    name: Slow tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # xvfb gives DearPyGui a real display. Without one, show_viewport()
          # calls abort() in native code: the run dies with SIGABRT (exit 134)
          # part-way through, taking every remaining test with it. With xvfb the
          # GUI tests genuinely execute instead of skipping.
          sudo apt-get install -y libsndfile1 libglib2.0-dev xvfb
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run slow tests
        run: xvfb-run -a pytest --slow -m slow

  download:
    name: Dataset download tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # xvfb gives DearPyGui a real display. Without one, show_viewport()
          # calls abort() in native code: the run dies with SIGABRT (exit 134)
          # part-way through, taking every remaining test with it. With xvfb the
          # GUI tests genuinely execute instead of skipping.
          sudo apt-get install -y libsndfile1 libglib2.0-dev xvfb
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run downloading tests
        run: xvfb-run -a pytest --download -m download

  gui:
    name: GUI / viewport tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # xvfb provides the display DearPyGui's show_viewport() requires.
          # Without one it calls abort() in native code and the run dies with
          # SIGABRT rather than a catchable exception.
          sudo apt-get install -y libsndfile1 libglib2.0-dev xvfb
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run GUI tests
        run: xvfb-run -a pytest --gui -m gui
