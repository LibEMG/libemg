name: CI pipeline
on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 libglib2.0-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      # The default run is hermetic: no network, no hardware. Tests that need
      # either are behind --slow / --download / --hardware (see tests/conftest.py)
      # and run in the nightly job below.
      - name: Run tests
        run: pytest --cov=libemg --cov-report=term-missing --cov-fail-under=30

  docs:
    name: Build and publish docs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 libglib2.0-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build docs
        run: sphinx-build docs/source _build
      - name: Publish docs
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/
          force_orphan: true
