name: CI pipeline
on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # NOTE: pyproject.toml now declares requires-python = ">=3.13", so this
    # matrix tests three versions the package says it does not support. It
    # passes only because requirements.txt installs a flat dependency list and
    # never installs libemg itself, so pip never checks requires-python.
    # Either the matrix or requires-python should move -- that is a support
    # policy call, so it is left as-is rather than guessed at here.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 libglib2.0-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      # The default run is hermetic: no network, no hardware. Tests that need
      # either are behind --slow / --download / --hardware (see tests/conftest.py)
      # and run in the nightly job below.
      - name: Run tests
        # Measured at 66% with the [tool.coverage.run] omit list in
        # pyproject.toml applied (vendor streamers and GUI panels need a device
        # or a display). That block went missing in the #145-#148 merge, which
        # is why a run briefly reported 18%. The floor sits well below the
        # measured value so a platform difference cannot fail the build on its
        # own; raise it as coverage grows -- it should only ever move up.
        run: pytest --cov=libemg --cov-report=term-missing --cov-fail-under=55

  docs:
    name: Build and publish docs
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    # Only on a merge to main. Gating the whole job -- rather than just the
    # publish step -- means pull requests and branch pushes skip the runner
    # and the dependency install entirely, instead of building docs that are
    # thrown away.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 libglib2.0-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build docs
        run: sphinx-build docs/source _build
      - name: Publish docs
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/
          force_orphan: true
