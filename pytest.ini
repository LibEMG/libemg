[pytest]
testpaths = tests
addopts = --strict-markers

markers =
    slow: long-running test, excluded by default (run with --slow, provided by pytest-skip-slow)
    hardware: requires a physical EMG device to be connected (run with --hardware)
    download: downloads a dataset over the network (run with --download)

# Third-party noise that drowns out warnings worth reading. libemg's own
# warnings are deliberately left visible.
filterwarnings =
    ignore:Importing from numpy.matlib is deprecated:PendingDeprecationWarning
    ignore:`alltrue` is deprecated:DeprecationWarning
    ignore:pkg_resources is deprecated:DeprecationWarning
    ignore:Deprecated call to `pkg_resources:DeprecationWarning
